# Model and judge checkpoints of the paper, each pinned to the Hugging Face revision every reported number was
# generated with. `streamreplace download models|judges` reads the checkpoint references from configs/models.yaml and
# configs/judges.yaml ("<repo>@<revision>") and checks them against this list; nothing listed here is redistributed.
#
# Fields
#   key          the Hugging Face model repository
#   revision     the full commit downloaded (the local folders' download metadata recorded it for every file)
#   role         model (a paper model's weights) | vision (a vision tower loaded separately) | judge
#   used_by      model id (configs/models.yaml) or judge id (configs/judges.yaml) -> the field that references the
#                checkpoint there (checkpoint, base, vision, checkpoints.<kind>)
#   dir          the folder under the checkpoints root (default <checkpoints>/<repo>; a paths file can map a
#                repository elsewhere with `checkpoint_dirs`)
#   license      as declared on the model card at this revision; check it yourself before use
#   files        number of files in the repository at this revision
#   notes        anything a downloader should know
version: 1
checkpoints:
