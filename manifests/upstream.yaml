      "thinkstream/trainer/sft.py": 6a77c935e344a1225373902144d3b51e06c28027
    patches:
      "thinkstream/model/inference.py":
        upstream_blob: e27dbc98ca70644b08140a34fb2f207bd7bd4763
        why: >-
          Upstream's own comment says the last window also takes queries stamped exactly at its end, but the
          code compares with '<', so a question stamped at the very end of the video (where the S protocol asks
          it) would never be delivered. The edit implements the documented rule; the paper's ThinkStream stream
          runs used it.
        edits:
          - old: "            if ts < w_end:\n"
            new: "            if ts < w_end or (is_last_iter and ts == w_end):\n"
