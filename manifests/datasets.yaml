# Where every benchmark's data comes from, pinned. `streamreplace download datasets NAME... | SUITE | all` reads this
# file; nothing listed here is redistributed with the repository. Files go to <data>/<benchmark>/raw/ (data root:
# $STREAMREPLACE_DATA, default $STREAMREPLACE_HOME/data), which is what `streamreplace prepare` reads.
#
# Source types (`sources`, processed in order):
#   hf         Hugging Face dataset repository at a full commit `revision`; `allow` = the file patterns fetched
#              (fnmatch, as huggingface_hub). `files`/`bytes`: what the patterns match at that revision.
#              `checksums`: per-file size and sha256 (or git blob SHA-1 for small non-LFS files), from the copies
#              the paper used; `folders`: file count and size of many-file media folders (no per-file sums).
#   github     files of a GitHub repository at a full `commit`: `files` lists path -> size + sha256, or `tree`
#              names a folder taken whole, checked by `tree_files` and `tree_sha256` (sha256 of the sorted
#              "<path> <git blob SHA-1>" lines of the folder at that commit).
#   url        one file from a fixed URL, checked by size and sha256 (and md5 where the publisher gives one).
#   gdrive     one file from Google Drive by file id (needs gdown), checked by size and sha256; `unzip: true`
#              unpacks the archive next to itself.
#   modelscope a ModelScope dataset without immutable revisions (pinned: false): refused unless
#              --allow-unpinned is given.
# `to`         the path under raw/ (default: the source path).
# `license`    the licence as the publisher declares it; check it yourself before use.
# `terms`      printed before the download; with `requires_acceptance: true` the download needs
#              --accept-terms NAME.
# `group`      image | video | safety | trust | finetune (the paper's benchmarks) | calibration (plugin inputs).
version: 1
