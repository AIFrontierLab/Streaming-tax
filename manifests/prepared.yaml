# What `streamreplace prepare` must produce from the pinned raw data (manifests/datasets.yaml), per benchmark: every
# benchmark of the paper (the 17 of the P/C/S evaluation, the 3 of the fine-tuning experiment and the 2 streaming
# benchmarks of the supplement). The paper's runs used exactly these samples and prompts; `streamreplace prepare --verify` and the requires_data tests compare a local
# preparation against these values (a benchmark without a row is reported as not verified).
#
# Fields
#   count           number of prepared samples (lines of <dataset>/prepared/samples.jsonl)
#   samples_sha256  sha256 of prepared/samples.jsonl as prepare writes it: one JSON object per line,
#                   json.dumps(Sample.to_dict(), ensure_ascii=False) + "\n", media paths relative to the dataset folder
#   prompts_sha256  sha256 of the id -> prompt map: the UTF-8 bytes of
#                   json.dumps({id: benchmark.prompt(sample view) for every prepared sample}, sort_keys=True,
#                   ensure_ascii=False). P, C and S send these prompts unchanged.
#
# Video-MME's samples differ from the original preparation in one documented field only: metadata.subtitle is now
# relative to the dataset folder (media/subtitle/<video>.srt) instead of an absolute path. No prompt reads it.
