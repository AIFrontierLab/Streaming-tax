      "llava/model/multimodal_encoder/builder.py":
        upstream_blob: 0a7b1600fe3226db846f93f25f013571fbcb9481
        why: >-
          Upstream sends every existing local directory to the CLIP vision tower, so a SigLIP tower loaded from
          a local checkpoint folder would be built as CLIP. The edit dispatches SigLIP first; the paper's
          LLaVA-OneVision and MMDuet runs used it.
        edits:
          - old: "    if is_absolute_path_exists or vision_tower.startswith(\"openai\") or vision_tower.startswith(\"laion\") or \"ShareGPT4V\" in vision_tower:\n"
            new: "    # Local SigLIP directories must be dispatched before the generic local CLIP branch.\n    if \"siglip\" in vision_tower.lower():\n        return SigLipVisionTower(vision_tower, vision_tower_cfg=vision_tower_cfg, **kwargs)\n    elif is_absolute_path_exists or vision_tower.startswith(\"openai\") or vision_tower.startswith(\"laion\") or \"ShareGPT4V\" in vision_tower:\n"
