# Stream++ (Sec. 6; docs/plugin.md): a training-free plugin that acts on a streaming child's memory and answer turn.
#   Recall   keeps earlier frames within the child's native memory budget          (plugin/recall.py)
#   Respond  makes sure an answer is delivered                                     (plugin/respond.py)
#   Refuse   parent-restoration steering (PRS) + a refusal gate on the harm score  (plugin/guard.py)
# S_fix = Recall + Respond; S_plug = S_fix + Refuse. Per-child numbers (direction, vector, layers, thresholds) live
# in plugin_artefacts/<child>/{vectors.npz, manifest.json}.

refusal: "I'm sorry, but I can't help with that request."

# Plugin arms, run as jobs <child>@<arm>.stream. recall: budget applies the child's `recall` settings below, native
# leaves its memory alone; respond: the child's `respond` settings, the silence ban and the option readout.
# gate: shadow = project and log, never act (the paper's runs; the threshold is applied afterwards by
# `plugin assemble` / `plugin report`, which read shadow arms only); live = reply with the fixed refusal when the
# logged projection passes the threshold (deployment; same decision as the post-hoc rule), ending the answer turn at
# its first step except on ThinkStream's `deadline` path, whose turn runs to its end; record = log the projection and
# end the answer turn at its first step, again except ThinkStream's (threshold calibration); null = no gate.
arms:
  sfix:     {recall: budget, respond: true, gate: shadow, prs: false}    # S_fix
  sfix_prs: {recall: budget, respond: true, gate: shadow, prs: true}     # S_fix + PRS; with the gate applied: S_plug
  record:   {recall: budget, respond: true, gate: record, prs: false}
  shadow:   {recall: native, respond: false, gate: shadow, prs: false}   # native stream, gate score logged
  prs:      {recall: native, respond: false, gate: shadow, prs: true}    # gate + PRS on the native memory and policy
  inert:    {recall: native, respond: false, gate: null, prs: false}     # plugin attached, nothing changed (fidelity)
  hf:       {recall: native, respond: false, gate: null, prs: false}     # AURA's HF stream rebuild alone (S_HF)

# S_plug in the paper = the sfix_prs arm with the post-hoc gate.
plug_arm: sfix_prs

# Gate thresholds (plugin/calibrate/thresholds.py; the shipped manifests hold the values): each is a 97.5th
# percentile of the gate's score on harmless requests of that answer format.
thresholds:
  quantile: 0.975
  projection_decimals: 3        # the gate compares the projection rounded to 3 decimals, as it was logged
  closed_decimals: 4
  closed_kinds: [mcq, yesno]    # closed-choice items use tau_closed, everything else tau_free
  min_fit_requests: 100

# A fired item takes the fixed refusal's own scored row; on these understanding sets it is unanswered and wrong
# instead (their parsers would otherwise credit the refusal with an option).
unanswered_on_fire: [videomme, tomato, timeblind, ovo_bench, streamingbench]

# Recall: settings deltas merged into the child's stream settings for arms with recall: budget. The budget is the
# child's own native visual budget B; once it is full, the newest k = 10 chunks stay and the other B - k slots hold a
# uniform sample of earlier chunks (plugin/recall.py). The other four children discard no frames natively.
recall:
  aura_8b: {stream: {window: full, budget: 30, recent: 10}}   # B = 30 one-second segments (aura_stream_hf)
  thinkstream_3b: {stream: {reservoir: 10}}                   # B = its native 20-chunk KV window

# Respond: settings deltas for arms with respond: true. MMDuet's response heads rarely fire, so its answer turn is
# requested explicitly (rho <- 1, the forced-answer control S-dagger of Sec. 5.2); the other children always produce an
# answer turn, whose silence marker is banned (answer_turn below).
respond:
  mmduet_7b: {stream: {force_answer: true}}

# Stream adapter of the plugin arms when it differs from the model's own stream adapter: AURA's native stream runs in
# a vLLM server without hidden states, so its plugin arms run on the Hugging Face rebuild.
engines:
  aura_8b: aura_stream_hf

# Each child's answer turn as its stream adapter runs it (docs/plugin.md, "Per child"); both keys are required.
#   silence: the marker the turn may not open with under Respond: one token of the child's tokenizer (banned with
#            <|im_end|>), "NO REPLY" (MMDuet2's two-token reply, logits processor only; plugin/respond.py) or null
#            (no marker; the only choice for logits deadline).
#   logits:  where the adapter hands the hooks the turn's logits: processor (a Hugging Face logits processor in the
#            answer turn's generate), first_step (the LM head; rules on the first step), opening (the LM head; rules
#            on the opening steps until the first visible token after <|response|>) or deadline (none: the option
#            readout comes from the deadline fork, and a live or record gate cannot end the turn early).
# Arms with Respond or a live / record gate refuse a child without an entry; a logits call on another path raises.
answer_turn:
  mmduet_7b:      {silence: null, logits: first_step}            # Respond forces its reply: no marker
  thinkstream_3b: {silence: null, logits: deadline}              # answers after its thought
  mmduet2_3b:     {silence: "NO REPLY", logits: processor}
  aura_8b:        {silence: "<|silent|>", logits: processor}
  livestar_8b:    {silence: null, logits: processor}             # no silence marker
  moss_vl_rt:     {silence: "<|silence|>", logits: opening}

children: [mmduet_7b, thinkstream_3b, mmduet2_3b, aura_8b, livestar_8b, moss_vl_rt]

# Item sets (benchmark ids only): `--items full` or a path to a {dataset: [ids]} file.
items:
  full: paper/frozen/plugin/full_items.json            # the paper's evaluation: 10,140 rows per child (Sec. 6, Supp. D)
  pilot2: paper/frozen/plugin/pilot2_items.json        # the second pilot (908 items; disjoint from `full`)
  threshold: paper/frozen/plugin/threshold_items.json  # 301 harmless dev-slice items behind the thresholds
  stream_pilot: paper/frozen/plugin/stream_pilot_items.json   # 576 streaming-benchmark pilot rows (closed threshold)
  dev: paper/frozen/plugin/dev_slice.json              # 451-item dev slice (never evaluated)
  dev_exclude: paper/frozen/plugin/dev_exclude.json

calibration:
  texts: paper/frozen/plugin/calibration_texts.json    # AdvBench / Alpaca row indices + fold
  videos: paper/frozen/plugin/calibration_videos.json  # Video-MME short videos in sha256 order
  harmless: paper/frozen/plugin/harmless_requests.json # harmless requests on benign clips: windows, templates
  capture_benchmark: video_safetybench                 # offline settings of the state capture (16 uniform frames)
  harmless_benchmark: video_safetybench                # stream settings of the harmless requests
  harmless_max_new_tokens: 160
  fold0_videos: 96
  fold1_videos: 48
  depth: [0.3, 0.6]                                    # refusal layer searched in [int(0.3 L), int(0.6 L))
  prs_depths: [0.2, 0.8, 7]                            # np.linspace(0.2, 0.8, 7) of (L - 1)
  alphas: [0.5, 1.0, 1.5]
