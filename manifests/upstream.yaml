# Third-party code that streamreplace reads at run or scoring time, pinned to exact commits.
#
# Nothing listed here is redistributed with this repository. `streamreplace fetch-upstream [NAME ...|all]`
# downloads exactly the listed files from each project's own GitHub repository at the pinned commit into
# <upstream root>/<name>/<path in the repository> (upstream root: $STREAMREPLACE_UPSTREAM, default
# $STREAMREPLACE_HOME/upstream) and checks every file against its git blob SHA-1, the value `git hash-object FILE`
# prints. `streamreplace fetch-upstream --verify-only` repeats the check offline.
#
# Fields
#   repo, commit  the GitHub repository and the full commit the files are taken from
#   license       the licence file found at that commit; "none" means the repository has no licence file, so its
#                 code is fetched from the authors' repository and not copied here beyond the few fragments NOTICE
#                 lists (see NOTICE and docs/licensing.md)
#   group         core: P/C/S evaluation and scoring; generalization: prompt robustness and fine-tuning;
#                 reference: cited for provenance only, never fetched
#   used_for      what streamreplace takes from the repository
#   files         repository path -> git blob SHA-1 of the file as streamreplace uses it (after `patches`)
#   patches       small local edits the paper's runs used, applied right after download. The downloaded file must
#                 have blob `upstream_blob`; each `old` string must occur exactly `count` times (default 1) and is
#                 replaced by `new`, in order; the result must have the blob listed under `files`.
version: 1
