      "questions/chip.json": d1b0a16fd5edf29b68426a7dc73a5c613a54955a
      "questions/cup.json": 2cedb0cab8e78248da48f0764d544a25ba5d13a2
      "questions/file_sys.json": 2c88dd8ba57a206c637cd40280b4c65cf94a386d
      "questions/grid.json": 148c0d95daab0fe63333bcd2b24f1d01ec12b5d0
      "questions/hrd.json": ee1f20642724f68d4ba5c8fcf070ac7b034900ed
      "utils/eval_utils.py": 4993b2bf307add550088794dca1069a93909f1b3
      "utils/show_results.py": c4ed5de6f0015923a3be78c4fc7ac8341b78b426
    patches:
      "utils/eval_utils.py":
        upstream_blob: f14ebc3a61ad18cd079e3ccfb6f2f91ed0f942c4
        why: >-
          The judge's move lists are parsed with ast.literal_eval instead of eval (judge output is never
          executed), and a malformed list or an unknown cup name fails the state check instead of crashing the
          scorer. The paper's VideoReasonBench scores used these rules.
        edits:
          - old: "import copy, re, openai, os, time\n"
            new: "import ast\nimport copy, re, openai, os, time\n"
          - old: "        moves = [m.lower() for m in eval(moves)]\n"
            new: "        moves = [m.lower() for m in ast.literal_eval(moves)]\n"
          - old: "    except SyntaxError:\n"
            new: "    except (SyntaxError, ValueError, TypeError, AttributeError):\n"
          - old: "        moves = eval(moves)\n"
            new: "        moves = ast.literal_eval(moves)\n"
            count: 3
          - old: "        cup = move.split()[-1]\n"
            new: "        cup = move.split()[-1]\n        if cup not in states:\n            return False\n"
